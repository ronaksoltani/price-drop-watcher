[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "price-drop-watcher"
version = "1.0.0"
description = "A configurable price monitor with Telegram alerts."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["price_drop_watcher*"]
